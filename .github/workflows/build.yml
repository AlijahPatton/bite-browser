name: Build Bite APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip project.zip
          cp -r bite-apk/. .
          rm -rf bite-apk project-2.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0'

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release-unsigned.apk bite.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Bite v${{ github.run_number }}
          body: Latest build of Bite browser
          files: bite.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
